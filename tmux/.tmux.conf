# ============================================================================
# ~/.tmux.conf
# ============================================================================

# ----------------------------------------------------------------------------
# General behavior
# ----------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Reloaded!"   # quick reload

set -g base-index 1              # windows start at 1, not 0
setw -g pane-base-index 1        # panes start at 1, not 0
set -g renumber-window on        # renumber windows when one is closed
set -g allow-rename off          # don't let programs rename windows
set -g mouse on                  # enable mouse: click panes, drag borders, scroll
set -g focus-events on           # let nvim/etc react to focus changes (:checktime)
set -s escape-time 0             # kill vim <Esc> lag (default 500ms wait for meta seqs)
setw -g mode-keys vi             # vi-style keys in copy mode

# ----------------------------------------------------------------------------
# Terminal / color support
# ----------------------------------------------------------------------------
# tmux-256color is the modern recommendation (tmux >= 3.2) and gives proper
# truecolor/Tc + styled-underline terminfo capabilities that screen-256color
# lacks. CAVEAT: on minimal WSL/Linux installs the `tmux-256color` terminfo
# entry may be missing until you install it — if you see
# "open terminal failed: missing or unsuitable terminal: tmux-256color",
# run: sudo apt install ncurses-term   (Debian/Ubuntu/WSL)
# or fall back to the screen-256color line below, which is essentially always
# present out of the box on every platform.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB"
# --- fallback if tmux-256color terminfo isn't installed on a given machine ---
# set -g default-terminal "screen-256color"
# set -ag terminal-overrides ",xterm-256color*:RGB"

# ----------------------------------------------------------------------------
# Prefix key
# ----------------------------------------------------------------------------
set -g prefix C-Space
# let a literal C-Space pass through to a nested/inner tmux session (e.g. tmux
# over SSH into a remote tmux) instead of always being swallowed as prefix
bind-key -n C-Space send-prefix

# ----------------------------------------------------------------------------
# Pane navigation (vim-like)
# ----------------------------------------------------------------------------
# Handled by vim-tmux-navigator below via unprefixed C-h/C-j/C-k/C-l, which
# also hands off seamlessly into Vim splits. Uncomment these for a prefixed
# hjkl fallback alongside it — they don't conflict, just redundant by default.
# bind-key h select-pane -L
# bind-key j select-pane -D
# bind-key k select-pane -U
# bind-key l select-pane -R

# ----------------------------------------------------------------------------
# Copy mode: yank to system clipboard (cross-platform: macOS / Linux / WSL)
# ----------------------------------------------------------------------------
# Tries each platform's clipboard tool in turn at copy-time, so the same
# binding works unmodified on Darwin, Linux (X11 or Wayland), and WSL.
# Linux X11 needs xclip or xsel installed; Wayland needs wl-clipboard.
COPY_CMD='if command -v pbcopy >/dev/null 2>&1; then pbcopy; \
elif command -v clip.exe >/dev/null 2>&1; then clip.exe; \
elif command -v wl-copy >/dev/null 2>&1; then wl-copy; \
elif command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; \
elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; \
fi'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$COPY_CMD"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "$COPY_CMD"

# ----------------------------------------------------------------------------
# Catppuccin theme — https://github.com/catppuccin/tmux
# Minimal: soft rounded chrome, one quiet accent, icons only when they're actually informative.
# ----------------------------------------------------------------------------
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"

# --- Windows: rounded, quiet accent (blue reads more "macOS focus ring"
#     than the default mauve — change back to mauve/lavender if you'd rather
#     match the rest of the mocha palette)
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_current_number_color "#{@thm_blue}"

# --- Window flags: icons only, shown only when relevant (activity/bell/zoom/mark)
set -g @catppuccin_window_flags "icon"

# --- Panes: thin per-pane title bar (path/command), muted when inactive,
#     one accent color when active — the "focus ring" pattern
set -g @catppuccin_pane_status_enabled "yes"
set -g @catppuccin_pane_border_status "top"
set -g @catppuccin_pane_border_style "fg=#{@thm_overlay_0}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_blue}"
set -g @catppuccin_pane_default_text "##{b:pane_current_path}"
set -g @catppuccin_pane_number_position "left"


# --- Status line: app running on the left (like a macOS menu-bar app name),
#     directory / date-time / session on the right (like the macOS clock cluster)
set-option -g status-position top
set -g status-left-length 100
set -g status-left ""
set -g status-right-length 100
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

set -g @catppuccin_directory_text " #{pane_current_path}"
set -g @catppuccin_date_time_text " %m-%d %H:%M"

# ----------------------------------------------------------------------------
# Plugins (TPM)
# ----------------------------------------------------------------------------
# tpm listed first per TPM's own documented convention.
# catppuccin pinned to a release tag — floating on its default branch risks a
# silent blank status bar if a future breaking release changes variable names.
# Bump this deliberately when you want to upgrade: https://github.com/catppuccin/tmux/tags
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "catppuccin/tmux#v2.3.0"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "christoomey/vim-tmux-navigator"

# Initialize tmux plugin manager and source all plugins (keep at the very bottom)
run "~/.tmux/plugins/tpm/tpm"
